[package]
name = "ctftool"
version = "0.2.0"
authors = ["mephi42 <mephi42@gmail.com>"]
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
cookie = "0.18.1"
cookie_store = "0.22.0"
console = "0.16.1"
elf = "0.8.0"
env_logger = "0.11.8"
futures = "0.3.31"
hex = "0.4.3"
indicatif = "0.18.3"
lazy_static = "1.5.0"
log = "0.4.29"
regex = "1.12.2"
reqwest = { version = "0.12.25", features = ["json", "multipart"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tinytemplate = "1.2.1"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread"] }
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.1.1"
hyper = { version = "0.14.32", features = ["http1", "server", "tcp"] }
tempdir = "0.3.7"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ctf"
path = "src/main.rs"
